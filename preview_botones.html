<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preview Botones Praxis-Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #0f1216 url('https://w0.peakpx.com/wallpaper/322/630/HD-wallpaper-dark-room-with-wooden-floor-and-dark-walls.jpg') center/cover;
            font-family: 'Outfit', sans-serif;
        }

        /* Overlay para simular tu home */
        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(15, 18, 22, 0.85);
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.5);
        }

        h2 {
            color: #C6A87C;
            margin-bottom: 30px;
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .btn-group {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        /* EL CÓDIGO DE TUS BOTONES */
        .p-btn {
            position: relative;
            padding: 18px 48px;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            text-decoration: none !important;
            border-radius: 14px;
            transition: all 0.5s cubic-bezier(0.15, 0.85, 0.35, 1);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            cursor: pointer;
            border: none;
        }

        /* BOTÓN PRIMARIO: EFECTO ORO LÍQUIDO */
        .p-primary {
            color: #C6A87C !important;
            background: linear-gradient(135deg, rgba(198, 168, 124, 0.12) 0%, rgba(198, 168, 124, 0.05) 100%);
            border: 1px solid rgba(198, 168, 124, 0.4);
            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.4),
                inset 0 0 15px rgba(198, 168, 124, 0.05);
        }

        .p-primary:hover {
            color: #ffffff !important;
            background: rgba(198, 168, 124, 0.2);
            border-color: rgba(198, 168, 124, 1);
            transform: translateY(-5px);
            box-shadow:
                0 15px 45px rgba(198, 168, 124, 0.2),
                inset 0 0 20px rgba(198, 168, 124, 0.1);
            text-shadow: 0 0 12px rgba(198, 168, 124, 0.6);
        }

        /* Brillo de luz que recorre el botón al pasar el mouse */
        .p-primary::after {
            content: "";
            position: absolute;
            top: -50%;
            left: -60%;
            width: 20%;
            height: 200%;
            background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.2), transparent);
            transform: rotate(30deg);
            transition: 0.7s;
        }

        .p-primary:hover::after {
            left: 120%;
        }

        /* BOTÓN SECUNDARIO: CRISTAL OBSIDIANA */
        .p-secondary {
            color: rgba(255, 255, 255, 0.85) !important;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .p-secondary:hover {
            color: #fff !important;
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.7);
            transform: translateY(-5px);
            box-shadow: 0 15px 45px rgba(255, 255, 255, 0.1);
        }

        /* Efecto de presión real */
        .p-btn:active {
            transform: translateY(-1px) scale(0.96);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
            transition: 0.1s;
        }
    </style>
</head>

<body>
    <div class="overlay"></div>
    <div class="container">
        <h2>Prueba de Botones Interactivos</h2>
        <div class="btn-group">
            <a href="contacto.html" class="p-btn p-primary">Solicita una propuesta</a>
            <a href="#servicios" class="p-btn p-secondary">Ver servicios</a>
        </div>
    </div>
</body>

</html>
